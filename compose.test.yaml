name: did-stage-01-test

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: did_test
      POSTGRES_USER: did_admin
      POSTGRES_PASSWORD: local_admin_password
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/010-did-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U did_admin -d did_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [did-test]

  redis:
    image: redis:8.8.1-alpine
    ports:
      - "56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [did-test]

networks:
  did-test:
    name: did-stage-01-test
