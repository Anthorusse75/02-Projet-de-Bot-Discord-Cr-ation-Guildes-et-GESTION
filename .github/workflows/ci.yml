name: CI

on:
  pull_request:
  push:
    branches: [main, "stage/**"]

permissions:
  contents: read

jobs:
  stage-01:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start real PostgreSQL and Redis
        run: docker compose -f compose.test.yaml up -d --wait
      - name: Validate STAGE 01
        run: python scripts/validate_stage.py 01
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-01-validation
          path: artifacts/stage-01
      - name: Stop test infrastructure
        if: always()
        run: docker compose -f compose.test.yaml down --volumes
