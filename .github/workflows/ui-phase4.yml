name: UI Phase 4 focused gate

on:
  push:
    branches: ["ui/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-access:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Visible-string/i18n guard
        run: python ../scripts/check_frontend_i18n.py
      - name: Live role event routing only
        run: npx vitest run src/api/useGuildSocket.phase4.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 4 access use cases only
        run: npx playwright test e2e/phase04-access.spec.ts --project=chromium
